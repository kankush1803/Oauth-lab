<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Google OAuth Authentication</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Login</h1>
      <p class="subtitle">Sign in to continue to your dashboard</p>
    </header>

    <main>
      <section class="login-card">
        <p>
          You are not currently signed in. Click the button below to log in
          with your Google account.
        </p>

        <a href="/auth/google" class="btn btn-google">
          <img src="https://auth0.com/assets/img/social_google.png" alt="Google" class="btn-icon" />
          Login with Google
        </a>

        <p class="hint">
          <a href="/">Return to homepage</a>
        </p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Google OAuth Authentication Demo</p>
    </footer>
  </div>
</body>
</html>
