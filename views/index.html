<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google OAuth Authentication</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Google OAuth Authentication</h1>
      <p class="subtitle">Sign in with your Google account using OAuth 2.0</p>
    </header>

    <main>
      <section class="hero">
        <h2>Secure &amp; Simple Login</h2>
        <p>
          Authenticate with Google OAuth 2.0. Your profile information is
          retrieved securely via Passport.js without exposing your password.
        </p>

        <a href="/auth/google" class="btn btn-google">
          <img src="https://auth0.com/assets/img/social_google.png" alt="Google" class="btn-icon" />
          Login with Google
        </a>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Google OAuth Authentication Demo</p>
    </footer>
  </div>
</body>
</html>
